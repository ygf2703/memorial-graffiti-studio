name: Check studio
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: node scripts/publish-name-artwork.mjs --verify-published
      - run: npm audit --omit=dev
      - run: node scripts/preview-exact-names.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: ten-name-styles
          path: .netlify/name-evaluation/ten-name-styles.png
          include-hidden-files: true
          retention-days: 7
